<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepCode 预览检查</title><style>body{font:14px -apple-system,system-ui;margin:32px;color:#25252b}h1{font-size:20px}button,input{font:inherit;padding:6px 10px;margin:8px 8px 8px 0}section{margin-top:24px;padding:20px;background:#f5f5f7;border-radius:8px}p{line-height:1.6}</style><h1>DeepCode 预览检查</h1><p>本文件用于核对本次原生页面的布局、输入与实例保留。</p><label>草稿 <input placeholder="输入后收起、展开预览"></label><section><button id="count">页面计数：0</button><p>并排、铺满工作区和收起再打开应保留此页计数。</p></section><script>let count=0;document.querySelector('#count').onclick=event=>{event.currentTarget.textContent='页面计数：'+ ++count};</script></html>
