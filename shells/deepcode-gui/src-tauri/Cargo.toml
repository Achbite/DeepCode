[workspace]

[package]
name = "deepcode-gui-tauri-shell"
version = "0.5.40"
edition = "2021"
license = "MIT"
rust-version = "1.84"

[[bin]]
name = "DeepCode-GUI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
deepcode-kernel-abi = { path = "../../../crates/deepcode-kernel-abi" }
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
